  :root {
    color-scheme: light;
    --pink: #e3007d;
    --pink-dark: #b3005f;
    --pink-light: #ff5cb0;
    --pink-soft: #ffe3f1;
    --ink: #1c1a1a;
    --muted: #6b5a61;
    --line: #f3c6de;
    --paper: #fffdfd;
    --white: #ffffff;
    --wood: #c4884b;
    --wood-dark: #a46a31;
    --wood-light: #d9a165;
    --ok: #1d7a3a;
    --ok-soft: #e3f6e8;
    --display: "Alfa Slab One", "Rockwell", Georgia, serif;
    --body: "Bitter", "Rockwell", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    color: var(--ink);
    font: 400 17px/1.5 var(--body);
    -webkit-font-smoothing: antialiased;
    background-color: var(--wood);
    background-image:
      repeating-linear-gradient(90deg, rgba(60,30,5,.30) 0 2px, transparent 2px 72px),
      repeating-linear-gradient(90deg, rgba(255,235,200,.10) 0 9px, rgba(90,45,10,.07) 9px 17px, transparent 17px 31px, rgba(90,45,10,.05) 31px 36px),
      linear-gradient(180deg, var(--wood-light), var(--wood) 45%, var(--wood-dark));
    display: flex;
    justify-content: center;
    padding: 20px 16px 32px;
  }
  main { width: 100%; max-width: 420px; }
  svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .hidden { display: none !important; }

  /* ---------- Copos brindando ---------- */
  .cena { display: block; overflow: visible; }
  .cena .ce, .cena .cd { transform-box: fill-box; transform-origin: 50% 100%; animation: 2.8s ease-in-out infinite; }
  .cena .ce { animation-name: brindeE; }
  .cena .cd { animation-name: brindeD; }
  .cena .faisca { transform-box: fill-box; transform-origin: 50% 100%; opacity: 0; animation: faisca 2.8s ease-out infinite; }
  .cena .gota { opacity: 0; animation: gota 2.8s ease-out infinite; }
  .cena .gota:nth-of-type(2) { animation-name: gota2; }
  @keyframes brindeE {
    0%, 20% { transform: none; }
    40% { transform: translate(1px, -3px) rotate(9deg); }
    47% { transform: translate(0, -2px) rotate(5deg); }
    70%, 100% { transform: none; }
  }
  @keyframes brindeD {
    0%, 20% { transform: none; }
    40% { transform: translate(-1px, -3px) rotate(-9deg); }
    47% { transform: translate(0, -2px) rotate(-5deg); }
    70%, 100% { transform: none; }
  }
  @keyframes faisca {
    0%, 37% { opacity: 0; transform: scale(.5); }
    41% { opacity: 1; transform: scale(1); }
    56%, 100% { opacity: 0; transform: scale(1.25); }
  }
  @keyframes gota {
    0%, 38% { opacity: 0; transform: translate(0, 0); }
    42% { opacity: 1; }
    62%, 100% { opacity: 0; transform: translate(-9px, -10px); }
  }
  @keyframes gota2 {
    0%, 38% { opacity: 0; transform: translate(0, 0); }
    42% { opacity: 1; }
    62%, 100% { opacity: 0; transform: translate(9px, -12px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .cena .ce, .cena .cd, .cena .faisca, .cena .gota { animation: none; }
  }

  /* ---------- Selo ---------- */
  .selo { position: relative; width: min(300px, 80vw); margin: 0 auto 22px; aspect-ratio: 1; }
  .selo > svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 8px 14px rgba(60,25,0,.35)); }
  .arco { font-family: var(--display); fill: var(--white); font-size: 22px; letter-spacing: 2px; }
  .faixa {
    position: absolute; left: -7%; right: -7%; top: 50%; transform: translateY(-50%);
    background: var(--ink); color: var(--white); text-align: center;
    padding: 10px 10% 9px;
    clip-path: polygon(0 0, 100% 0, 94% 50%, 100% 100%, 0 100%, 6% 50%);
    box-shadow: inset 0 3px 0 var(--ink), inset 0 5px 0 var(--white), inset 0 -3px 0 var(--ink), inset 0 -5px 0 var(--white);
  }
  .faixa h1 { font: 400 clamp(36px, 12vw, 48px)/1 var(--display); margin: 0; letter-spacing: 1.5px; }
  .faixa p { font: 700 12px/1 var(--body); color: var(--pink-light); letter-spacing: 3.5px; margin: 6px 0 0; }

  /* ---------- Cartão ---------- */
  .card {
    background: var(--paper);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(60,25,0,.35);
  }
  .card-corpo { padding: 22px 20px 24px; }
  .onda { position: relative; background: linear-gradient(180deg, #ff4fa6, var(--pink) 60%, #cc006f); height: 58px; margin-top: -1px; }
  .onda svg { display: block; width: 100%; height: 44px; }
  .onda::after { content: ""; position: absolute; inset: 44px 0 0; pointer-events: none;
    background-image: radial-gradient(circle at 18% 40%, rgba(255,255,255,.35) 0 2.5px, transparent 3.5px), radial-gradient(circle at 63% 60%, rgba(255,255,255,.3) 0 2px, transparent 3px), radial-gradient(circle at 88% 30%, rgba(255,255,255,.3) 0 2px, transparent 3px); }

  .etapa-topo { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 16px; }
  .num {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    background: var(--pink); color: var(--white);
    font: 400 15px/30px var(--display); text-align: center;
  }
  .etapa-topo h2 { font: 400 17px/1.25 var(--display); margin: 4px 0 6px; letter-spacing: .3px; }
  .etapa-topo p { margin: 0; font-size: 15px; color: var(--muted); line-height: 1.45; }

  .divisor { border: 0; border-top: 2px dashed var(--line); margin: 24px 0 22px; }

  /* Rótulo da senha */
  .rotulo {
    border: 3px solid var(--pink);
    border-radius: 16px;
    background: var(--white);
    padding: 16px 16px 16px;
    position: relative;
  }
  .rotulo::before { content: ""; position: absolute; inset: 5px; border: 1.5px solid var(--pink); border-radius: 11px; pointer-events: none; }
  .code-faixa {
    background: var(--ink); color: var(--white); text-align: center;
    margin: 0 0 14px;
    padding: 10px 0 8px;
    clip-path: polygon(0 0, 100% 0, 94% 50%, 100% 100%, 0 100%, 6% 50%);
    box-shadow: inset 0 3px 0 var(--ink), inset 0 4.5px 0 var(--white), inset 0 -3px 0 var(--ink), inset 0 -4.5px 0 var(--white);
    cursor: pointer;
  }
  .code { font: 400 34px/1.05 var(--display); letter-spacing: .18em; margin: 0; padding-left: .18em; user-select: all; }
  .copiar {
    position: relative; display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 11px 14px;
    background: var(--pink-soft); color: var(--pink-dark);
    font: 700 16px var(--body); border: 0; border-radius: 10px; cursor: pointer;
    transition: background .2s, color .2s;
  }
  .copiar.copiado { background: var(--ok-soft); color: var(--ok); }

  /* Campos */
  label { display: block; font: 700 15px var(--body); margin: 0 0 6px; }
  .campo { position: relative; margin-bottom: 16px; }
  .campo svg.i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--pink); pointer-events: none; }
  input {
    width: 100%;
    font: 500 18px var(--body);
    color: var(--ink);
    background: var(--white);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 13px 14px 13px 46px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: #ab979f; font-weight: 400; }
  input:focus { border-color: var(--pink); box-shadow: 0 0 0 4px var(--pink-soft); }
  #senha { letter-spacing: .16em; text-transform: uppercase; font-weight: 700; }
  #senha::placeholder { letter-spacing: normal; text-transform: none; font-weight: 400; }

  .msg { display: flex; gap: 8px; align-items: center; min-height: 0; margin: -4px 0 14px; font: 600 15px var(--body); color: var(--pink-dark); }
  .msg:empty { display: none; }
  .msg::before {
    content: "!"; flex: none; width: 20px; height: 20px; border-radius: 50%;
    background: var(--pink-dark); color: var(--white); font: 400 13px/20px var(--display); text-align: center;
  }

  .primary {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; margin-top: 6px;
    background: var(--pink); color: var(--white);
    font: 400 21px/1 var(--display); letter-spacing: 1px;
    padding: 17px 16px;
    border: 0; border-radius: 12px; cursor: pointer;
    box-shadow: 0 4px 0 var(--pink-dark);
  }
  .btn-texto { display: inline-flex; align-items: center; gap: 12px; margin-right: 2px; }
  .btn-texto svg.i { width: 16px; height: 16px; stroke-width: 3; overflow: visible; }
  .primary:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--pink-dark); }
  .primary:disabled { opacity: .7; cursor: default; }

  /* ---------- Tela final: copo rosa ---------- */
  .copo {
    background: linear-gradient(180deg, #ff4fa6, var(--pink) 55%, #c4006a);
    color: var(--white);
    text-align: center;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(60,25,0,.35);
    position: relative;
  }
  .espuma { display: block; width: 100%; height: 64px; }
  .bolhas { position: absolute; inset: 64px 0 0; pointer-events: none;
    background-image:
      radial-gradient(circle at 12% 30%, rgba(255,255,255,.35) 0 3px, transparent 4px),
      radial-gradient(circle at 86% 22%, rgba(255,255,255,.3) 0 2px, transparent 3px),
      radial-gradient(circle at 78% 72%, rgba(255,255,255,.3) 0 3px, transparent 4px),
      radial-gradient(circle at 18% 82%, rgba(255,255,255,.25) 0 2px, transparent 3px),
      radial-gradient(circle at 92% 52%, rgba(255,255,255,.3) 0 2px, transparent 3px);
  }
  .copo-corpo { position: relative; padding: 0 22px 22px; margin-top: -10px; }
  .copo .cena { width: 170px; margin: 0 auto 4px; }
  .icone-off { display: none; width: 64px; height: 64px; margin: 4px auto 8px; border-radius: 50%; background: rgba(255,255,255,.18); align-items: center; justify-content: center; }
  .icone-off svg.i { width: 34px; height: 34px; }
  .pendente .copo .cena, .pendente .cena-fim { display: none; }
  .pendente .icone-off { display: flex; }
  .fim-titulo { font: 400 42px/1 var(--display); margin: 0 0 10px; text-shadow: 0 3px 0 var(--pink-dark); }
  .big-name { font: 400 26px/1.15 var(--display); margin: 0 0 8px; word-break: break-word; }
  .fim-texto { margin: 0 auto 16px; max-width: 30ch; font-size: 16px; line-height: 1.5; }
  .big-code {
    display: inline-block; background: var(--ink); color: var(--white);
    font: 400 28px var(--display); letter-spacing: .18em; padding: 8px 14px 6px 20px; border-radius: 10px; margin: 0;
  }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; font: 700 15px var(--body); margin-top: 14px; background: var(--white); }
  .pill svg.i { width: 16px; height: 16px; stroke-width: 2.6; }
  .pill.ok { color: var(--ok); }
  .pill.warn { color: var(--pink-dark); }
  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .link { display: block; margin: 14px auto 0; background: none; border: 0; color: var(--white); text-decoration: underline; text-underline-offset: 3px; font: 600 15px var(--body); padding: 8px; cursor: pointer; }

  footer { display: flex; align-items: center; justify-content: center; gap: 6px; color: #fff6ea; font-size: 14px; margin-top: 18px; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
  footer svg.i { width: 15px; height: 15px; }
</style>
</head>
<body>

<!-- Desenhos reutilizados -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="cerveja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd34d"/>
      <stop offset="1" stop-color="#f29a12"/>
    </linearGradient>
    <symbol id="caneca" viewBox="0 0 48 60">
      <path d="M33 23h5a7 7 0 0 1 7 7v8a7 7 0 0 1-7 7h-5" fill="none" stroke="#1c1a1a" stroke-width="3.6"/>
      <rect x="3" y="14" width="31" height="43" rx="5" fill="#fff8e8" stroke="#1c1a1a" stroke-width="3"/>
      <rect x="7.5" y="20" width="22" height="33" rx="2.5" fill="url(#cerveja)"/>
      <rect x="11" y="24" width="3.2" height="24" rx="1.6" fill="#fff" opacity=".65"/>
      <circle cx="23" cy="44" r="1.6" fill="#fff" opacity=".7"/>
      <circle cx="19" cy="35" r="1.2" fill="#fff" opacity=".7"/>
      <circle cx="25" cy="29" r="1" fill="#fff" opacity=".7"/>
      <path d="M2.5 19.5C.5 12 7 6.5 11.5 9.5 13.5 3 23 2 25.5 8.5 30 4.5 38 8 35.5 15c3 2.5 1 7-3 5.5v4.5a2.6 2.6 0 0 1-5.2 0V20H5.5c-2 0-3.2-.2-3-0.5z" fill="#fff" stroke="#1c1a1a" stroke-width="3" stroke-linejoin="round"/>
    </symbol>
    <symbol id="estrela" viewBox="-10 -10 20 20">
      <path d="M0-9 2.1-2.9 8.6-2.8 3.4 1.1 5.3 7.3 0 3.6-5.3 7.3-3.4 1.1-8.6-2.8-2.1-2.9Z"/>
    </symbol>
  </defs>
</svg>

<main>
  <header class="selo" aria-label="Boteco: bem-vindo(a) à festa">
    <svg viewBox="0 0 300 300" aria-hidden="true">
      <defs>
        <path id="arcoTopo" d="M 42,150 A 108,108 0 0,1 258,150"/>
        <path id="arcoBase" d="M 26,150 A 124,124 0 0,0 274,150"/>
      </defs>
      <circle cx="150" cy="150" r="148" fill="#fff"/>
      <circle cx="150" cy="150" r="115" fill="none" stroke="#e3007d" stroke-width="40"/>
      <circle cx="150" cy="150" r="141" fill="none" stroke="#e3007d" stroke-width="1.5"/>
      <circle cx="150" cy="150" r="90" fill="none" stroke="#e3007d" stroke-width="1.5"/>
      <text class="arco"><textPath href="#arcoTopo" startOffset="50%" text-anchor="middle">BEM-VINDO(A)</textPath></text>
      <text class="arco"><textPath href="#arcoBase" startOffset="50%" text-anchor="middle">À FESTA</textPath></text>
      <use href="#estrela" x="26" y="141" width="18" height="18" fill="#fff"/>
      <use href="#estrela" x="256" y="141" width="18" height="18" fill="#fff"/>
      <svg class="cena" x="92" y="56" width="116" height="58" viewBox="0 0 140 70">
        <g class="faisca" fill="none" stroke="#e3007d" stroke-width="3" stroke-linecap="round">
          <path d="M70 6V-2M61 8l-5-6M79 8l5-6"/>
        </g>
        <circle class="gota" cx="64" cy="12" r="2.6" fill="#fff" stroke="#1c1a1a" stroke-width="1.5"/>
        <circle class="gota" cx="76" cy="12" r="2.2" fill="#fff" stroke="#1c1a1a" stroke-width="1.5"/>
        <g class="ce"><g transform="translate(67,8) scale(-1,1)"><use href="#caneca" width="48" height="60"/></g></g>
        <g class="cd"><g transform="translate(73,8)"><use href="#caneca" width="48" height="60"/></g></g>
      </svg>
      <text x="150" y="226" text-anchor="middle" fill="#e3007d" font-size="15" font-family="Alfa Slab One, Georgia, serif" letter-spacing="3">SAÚDE!</text>
    </svg>
    <div class="faixa">
      <h1>BOTECO</h1>
      <p>CHECK-IN DA FESTA</p>
    </div>
  </header>

  <!-- Tela 1: formulário -->
  <section id="tela-form" class="card">
    <div class="card-corpo">
      <div class="etapa-topo">
        <span class="num">1</span>
        <div>
          <h2>Copie sua senha</h2>
          <p>Ela é só sua, cada convidado recebe uma diferente.</p>
        </div>
      </div>
      <div class="rotulo">
        <div class="code-faixa" id="faixa-codigo" title="Toque para copiar"><p class="code" id="codigo">······</p></div>
        <button type="button" class="copiar" id="btn-copiar"></button>
      </div>

      <hr class="divisor">

      <form id="form" novalidate>
        <div class="etapa-topo">
          <span class="num">2</span>
          <div>
            <h2>Preencha seus dados</h2>
            <p>A recepção vai receber o seu nome.</p>
          </div>
        </div>

        <label for="nome">Seu nome</label>
        <div class="campo">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Ex.: Maria Silva" maxlength="60" required>
        </div>

        <label for="senha">Senha</label>
        <div class="campo">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4.5"/><path d="M11.2 11.8 20 3M16.5 6.5l3 3M14 9l2 2"/></svg>
          <input id="senha" name="senha" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Cole a senha da etapa 1" maxlength="12" required>
        </div>

        <p class="msg" id="msg" role="alert"></p>
        <button class="primary" type="submit" id="btn-enviar">Enviar</button>
      </form>
    </div>
    <div class="onda" aria-hidden="true">
      <svg viewBox="0 0 400 44" preserveAspectRatio="none"><path fill="#fffdfd" d="M0,0 H400 V14 C385,14 380,36 365,36 C350,36 352,10 330,12 C310,14 312,28 290,28 C268,28 270,6 245,8 C222,10 226,40 205,40 C184,40 186,12 165,12 C144,12 146,26 125,26 C104,26 106,6 85,8 C64,10 66,34 45,34 C26,34 22,14 0,16 Z"/></svg>
    </div>
  </section>

  <!-- Tela 2: confirmado / aguardando internet -->
  <section id="tela-fim" class="hidden">
    <div class="copo">
      <svg class="espuma" viewBox="0 0 400 64" preserveAspectRatio="none" aria-hidden="true">
        <path fill="#fff" d="M0,0 H400 V34 C385,34 380,56 365,56 C350,56 352,30 330,32 C310,34 312,48 290,48 C268,48 270,26 245,28 C222,30 226,60 205,60 C184,60 186,32 165,32 C144,32 146,46 125,46 C104,46 106,26 85,28 C64,30 66,54 45,54 C26,54 22,34 0,36 Z"/>
      </svg>
      <div class="bolhas" aria-hidden="true"></div>
      <div class="copo-corpo">
        <svg class="cena" viewBox="0 -6 140 76" aria-hidden="true">
          <g class="faisca" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round">
            <path d="M70 6V-2M61 8l-5-6M79 8l5-6"/>
          </g>
          <circle class="gota" cx="64" cy="12" r="2.6" fill="#fff" stroke="#1c1a1a" stroke-width="1.5"/>
          <circle class="gota" cx="76" cy="12" r="2.2" fill="#fff" stroke="#1c1a1a" stroke-width="1.5"/>
          <g class="ce"><g transform="translate(67,8) scale(-1,1)"><use href="#caneca" width="48" height="60"/></g></g>
          <g class="cd"><g transform="translate(73,8)"><use href="#caneca" width="48" height="60"/></g></g>
        </svg>
        <div class="icone-off" aria-hidden="true">
          <svg class="i" viewBox="0 0 24 24"><path d="M2 2l20 20M8.5 16.4a5 5 0 0 1 7 0M5 12.6a10 10 0 0 1 5.3-2.6M19 12.6a10 10 0 0 0-2.3-1.6M1.6 8.8a15 15 0 0 1 4.4-2.6M22.4 8.8A15 15 0 0 0 10.6 5.1"/><circle cx="12" cy="20" r=".8" fill="currentColor"/></svg>
        </div>
        <p class="fim-titulo" id="fim-titulo">Saúde!</p>
        <p class="big-name" id="fim-nome"></p>
        <p class="fim-texto" id="fim-texto"></p>
        <p class="big-code" id="fim-codigo"></p>
        <div><span class="pill" id="fim-status"></span></div>
        <button type="button" class="link" id="btn-outra">Registrar outra pessoa neste celular</button>
      </div>
    </div>
  </section>

  <footer>
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    Seu nome vai só para a recepção da festa.
  </footer>
</main>

<script>
(function () {
  // ===== CONFIGURAÇÃO =====
  // Canal do app ntfy que o celular da recepcionista assina.
  var NTFY_SERVIDOR = "https://ntfy.sh";
  var NTFY_CANAL = "festa-sn5m3b2ers";
  // ========================

  var ALFABETO = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // sem 0/O, 1/I/L para não confundir
  var CHAVE = "festa-checkin-v1";

  var ICONE = {
    copiar: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
    ok: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
    enviar: '<svg class="i" viewBox="5 5 14 14" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
  };

  function lerEstado() {
    try { return JSON.parse(localStorage.getItem(CHAVE)) || {}; } catch (e) { return {}; }
  }
  function salvarEstado(s) {
    try { localStorage.setItem(CHAVE, JSON.stringify(s)); } catch (e) {}
  }
  function gerarCodigo() {
    var out = "", buf = new Uint32Array(6);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(buf);
    else for (var i = 0; i < 6; i++) buf[i] = Math.floor(Math.random() * 4294967296);
    for (var j = 0; j < 6; j++) out += ALFABETO[buf[j] % ALFABETO.length];
    return out;
  }
  function limpar(s) { return String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); }
  function hora(ts) {
    var d = new Date(ts);
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  var $ = function (id) { return document.getElementById(id); };
  var estado = lerEstado();
  var timerRetentativa = null;
  var rolarAoMostrar = false;

  function botaoCopiar(copiado) {
    var b = $("btn-copiar");
    b.classList.toggle("copiado", !!copiado);
    b.innerHTML = copiado ? ICONE.ok + "Senha copiada!" : ICONE.copiar + "Copiar senha";
  }
  function botaoEnviar(enviando) {
    var b = $("btn-enviar");
    b.disabled = !!enviando;
    b.innerHTML = enviando ? '<span class="spinner"></span>Enviando…' : '<span class="btn-texto">Enviar' + ICONE.enviar + '</span>';
  }

  function iniciarFormulario() {
    if (!estado.codigo || estado.status) {
      estado = { codigo: gerarCodigo() };
      salvarEstado(estado);
    }
    $("codigo").textContent = estado.codigo;
    $("tela-form").classList.remove("hidden");
    $("tela-fim").classList.add("hidden");
    $("nome").value = "";
    $("senha").value = "";
    $("msg").textContent = "";
    botaoCopiar(false);
    botaoEnviar(false);
  }

  function mostrarFim() {
    var enviado = estado.status === "enviado";
    $("tela-form").classList.add("hidden");
    $("tela-fim").classList.remove("hidden");
    $("tela-fim").classList.toggle("pendente", !enviado);
    $("fim-nome").textContent = estado.nome;
    $("fim-codigo").textContent = estado.codigo;
    var st = $("fim-status");
    if (enviado) {
      $("fim-titulo").textContent = "Saúde!";
      $("fim-texto").textContent = "Chegada registrada, a recepção já foi avisada. Bora pro boteco!";
      st.className = "pill ok";
      st.innerHTML = ICONE.ok + "Avisado às " + hora(estado.enviadoEm || estado.chegada);
    } else {
      $("fim-titulo").textContent = "Quase lá!";
      $("fim-texto").textContent = "Estamos sem internet agora. Mostre esta tela na entrada. O aviso vai sozinho quando a conexão voltar, então não feche esta página.";
      st.className = "pill warn";
      st.innerHTML = '<span class="spinner"></span>Tentando enviar…';
    }
    if (rolarAoMostrar) {
      rolarAoMostrar = false;
      $("tela-fim").scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }

  function enviarAviso() {
    var corpo = {
      topic: NTFY_CANAL,
      title: "Chegou: " + estado.nome,
      message: estado.nome + " chegou às " + hora(estado.chegada) + " · senha " + estado.codigo,
      tags: ["tada"],
      priority: 4
    };
    var ctrl = window.AbortController ? new AbortController() : null;
    var t = setTimeout(function () { if (ctrl) ctrl.abort(); }, 10000);
    return fetch(NTFY_SERVIDOR + "/", {
      method: "POST",
      body: JSON.stringify(corpo),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) {
      clearTimeout(t);
      if (!r.ok) throw new Error("HTTP " + r.status);
    }, function (e) { clearTimeout(t); throw e; });
  }

  function tentarEnviar() {
    clearTimeout(timerRetentativa);
    if (estado.status !== "pendente") return Promise.resolve();
    return enviarAviso().then(function () {
      estado.status = "enviado";
      estado.enviadoEm = Date.now();
      salvarEstado(estado);
      mostrarFim();
    }, function () {
      mostrarFim();
      timerRetentativa = setTimeout(tentarEnviar, 6000);
    });
  }

  function copiar() {
    var txt = estado.codigo;
    function ok() { botaoCopiar(true); setTimeout(function () { botaoCopiar(false); }, 2000); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = txt; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); ok(); } catch (e) { $("btn-copiar").textContent = "Segure a senha para copiar"; }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(ok, fallback);
    else fallback();
  }
  $("btn-copiar").addEventListener("click", copiar);
  $("faixa-codigo").addEventListener("click", copiar);

  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var nome = $("nome").value.trim().replace(/\s+/g, " ");
    var senha = limpar($("senha").value);
    var msg = $("msg");
    if (nome.length < 2) { msg.textContent = "Digite seu nome."; $("nome").focus(); return; }
    if (!senha) { msg.textContent = "Cole ou digite a senha da etapa 1."; $("senha").focus(); return; }
    if (senha !== estado.codigo) { msg.textContent = "A senha não confere. Confira e tente de novo."; $("senha").focus(); return; }
    msg.textContent = "";

    estado.nome = nome;
    estado.chegada = Date.now();
    estado.status = "pendente";
    salvarEstado(estado);

    if (document.activeElement) document.activeElement.blur();
    botaoEnviar(true);
    rolarAoMostrar = true;
    tentarEnviar();
  });

  $("btn-outra").addEventListener("click", function () {
    if (estado.status === "pendente" && !confirm("O aviso desta pessoa ainda não foi enviado. Registrar outra mesmo assim?")) return;
    clearTimeout(timerRetentativa);
    estado = {};
    iniciarFormulario();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  window.addEventListener("online", tentarEnviar);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) tentarEnviar(); });

  // Início: se este celular já registrou alguém, mostra o resultado (e reenvia se ficou pendente)
  if (estado.status === "enviado" || estado.status === "pendente") {
    mostrarFim();
    tentarEnviar();
  } else {
    iniciarFormulario();
  }
})();
</script>
</body>
</html>
